services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chua
      POSTGRES_PASSWORD: chua
      POSTGRES_DB: chua
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chua']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  pgdata:
